[build]
# Unset default target
target = "riscv32imac-unknown-none-elf"
features = "esp32c6"

[env]
ESP_LOG = "INFO"

PIN_LED_STATUS = "10"
PIN_OPTICAL_RX = "0"
PIN_OPTICAL_TX = "1"

WIFI_SSID = "wat leuks"
WIFI_PASSWORD = "maakdatermaarvan"
MQTT_HOSTNAME = "192.168.1.10"
MQTT_USERNAME = "freemdu"
MQTT_PASSWORD = "PZrmSNk012cqv5EJ"

# Interval (in seconds) for publishing device properties and actions
DEVICE_PUBLISH_INTERVAL = "2"

[target.'cfg(target_arch = "riscv32")']
runner = "espflash flash --monitor"
rustflags = [
  # Required to obtain backtraces
  "-C", "force-frame-pointers",
  "-C", "link-arg=-Tlinkall.x",
]
